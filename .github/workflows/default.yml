name: CI - Validate AzuraCast Fork

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-test:
    name: PHP lint, static analysis and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPLICATION_ENV: testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, xdebug
          tools: composer:v2, cs2pr

      - name: Cache PHP dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Run PHP linter
        run: vendor/bin/parallel-lint . --exclude vendor --checkstyle | cs2pr

      - name: Build Codeception actors
        run: vendor/bin/codecept build

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --memory-limit=-1 --error-format=checkstyle | cs2pr

      - name: Run PHP Code Sniffer
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run unit tests
        run: vendor/bin/codecept run Unit --no-interaction

      - name: Check database migrations in pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          php backend/bin/console azuracast:dev:check-migrations "$BASE_SHA"

  node-test:
    name: Node lint, formatting and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --include=dev

      - name: Lint and check styling
        run: npm run ci

      - name: Check TypeScript types
        run: npm run tsc
